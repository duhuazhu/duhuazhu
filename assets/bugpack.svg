<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="190" viewBox="0 0 1012 190" role="img" aria-label="BugPack">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1608"/><stop offset=".55" stop-color="#161b22"/></linearGradient></defs>
<rect x=".5" y=".5" width="1011" height="189" rx="12" fill="url(#g)" stroke="#5a4a22"/>
<text x="32" y="46" fill="#f0f6fc" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif" font-size="26" font-weight="700">BugPack</text>
<rect x="166.0" y="24" width="96.0" height="26" rx="13" fill="#2d2208" stroke="#9e6a03"/><text x="214.0" y="41" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12" fill="#e3b341">MCP Server</text>
<text x="32" y="86" fill="#aab4bd" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif" font-size="14">从禅道、Jira、Linear、TAPD 一键导入 Bug，连截图附件一起拉过来，</text><text x="32" y="112" fill="#aab4bd" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif" font-size="14">也可以直接粘贴截图标注。内置 MCP Server，Claude Code、Cursor 读上下文改代码，</text><text x="32" y="138" fill="#aab4bd" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif" font-size="14">修完状态自动回写。全程本地。</text>
<text x="32" y="170" fill="#e3b341" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12">TypeScript</text>
<text x="118" y="170" fill="#8b949e" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12">npm: bugpack-mcp</text>
<text x="262" y="170" fill="#8b949e" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12">MIT</text>
<rect x="616" y="26" width="364" height="140" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="640" y="56" fill="#6e7681" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif" font-size="12">Bug 到修复的流程</text>
<text x="640" y="80" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12.5"><tspan fill="#39d353">01</tspan><tspan fill="#c9d1d9" dx="8" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif">导入禅道 / Jira Bug</tspan></text><text x="640" y="105" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12.5"><tspan fill="#39d353">02</tspan><tspan fill="#c9d1d9" dx="8" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif">截图标注，打包上下文</tspan></text><text x="640" y="130" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12.5"><tspan fill="#39d353">03</tspan><tspan fill="#c9d1d9" dx="8" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif">AI 读取并修改代码</tspan></text><text x="640" y="155" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12.5"><tspan fill="#e3b341">04</tspan><tspan fill="#c9d1d9" dx="8" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif">状态自动回写</tspan></text>
</svg>
