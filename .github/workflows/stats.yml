name: Stats

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 生成统计图
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - assets <<'PY'
          import json, math, os, subprocess, sys, urllib.request
          from datetime import date

          USER = 'duhuazhu'
          OUT_DIR = sys.argv[1] if len(sys.argv) > 1 else 'assets'

          token = os.environ.get('GH_TOKEN')
          if not token:
              token = subprocess.check_output(['gh', 'auth', 'token'], text=True).strip()

          QUERY = '''
          query($login:String!){
            user(login:$login){
              createdAt
              followers{totalCount}
              all:repositories(privacy:PUBLIC, ownerAffiliations:OWNER){totalCount}
              own:repositories(privacy:PUBLIC, ownerAffiliations:OWNER, isFork:false, first:100){
                nodes{name stargazerCount primaryLanguage{name color}}
              }
              contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{contributionCount date}}}}
            }
          }'''
          req = urllib.request.Request(
              'https://api.github.com/graphql',
              data=json.dumps({'query': QUERY, 'variables': {'login': USER}}).encode(),
              headers={'Authorization': 'bearer ' + token, 'Content-Type': 'application/json', 'User-Agent': 'profile-stats'})
          data = json.load(urllib.request.urlopen(req, timeout=30))
          if 'errors' in data:
              sys.exit('GraphQL 错误: ' + json.dumps(data['errors'], ensure_ascii=False))
          u = data['data']['user']

          nodes = u['own']['nodes']
          repos_total = u['all']['totalCount']
          stars = sum(n['stargazerCount'] for n in nodes)
          followers = u['followers']['totalCount']
          gis_repos = sum(1 for n in nodes if 'cesium' in n['name'].lower())
          bug_stars = next((n['stargazerCount'] for n in nodes if n['name'].lower() == 'bugpack'), 0)
          years = max(date.today().year - int(u['createdAt'][:4]), 1)
          cal = u['contributionsCollection']['contributionCalendar']
          days = [(d['date'], d['contributionCount']) for w in cal['weeks'] for d in w['contributionDays']]
          flat = [c for _, c in days]
          total = cal['totalContributions']
          best = max(flat) if flat else 0
          longest = run = 0
          for c in flat:
              run = run + 1 if c > 0 else 0
              longest = max(longest, run)

          langs = {}
          for n in nodes:
              pl = n['primaryLanguage']
              if pl:
                  item = langs.setdefault(pl['name'], [0, pl['color'] or '#8b949e'])
                  item[0] += 1
          lang_list = sorted(langs.items(), key=lambda kv: -kv[1][0])
          lang_total = sum(v[0] for _, v in lang_list) or 1

          MONO = "'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace"
          SANS = "'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif"
          W = 1012


          def card(x, y, w, h):
              return f'<rect x="{x + .5}" y="{y + .5}" width="{w - 1}" height="{h - 1}" rx="12" fill="#161b22" stroke="#30363d"/>'


          def title(x, y, s):
              return f'<text x="{x}" y="{y}" fill="#e6edf3" font-family="{SANS}" font-size="17" font-weight="700">{s}</text>'


          def wrap(parts, h, label):
              return (f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{h:.0f}" viewBox="0 0 {W} {h:.0f}" role="img" aria-label="{label}">'
                      + ''.join(parts) + '</svg>\n')


          def save(name, svg):
              os.makedirs(OUT_DIR, exist_ok=True)
              with open(os.path.join(OUT_DIR, name), 'w', encoding='utf-8', newline='\n') as f:
                  f.write(svg)


          # ======== 上半：统计条 + 贡献地形图 ========
          top = []
          kpis = [(str(repos_total), '公开仓库', '#39d353'), (str(stars), '获得 Star', '#e3b341'),
                  (str(followers), '粉丝', '#e6edf3'), (f'{total:,}', '近一年贡献', '#39d353'),
                  (str(longest), '最长连续天', '#e6edf3'), (str(best), '单日最高', '#e6edf3')]
          gap = 12
          bw = (W - gap * 5) / 6
          for i, (v, l, c) in enumerate(kpis):
              x = i * (bw + gap)
              top.append(f'<rect x="{x + .5:.1f}" y=".5" width="{bw - 1:.1f}" height="59" rx="10" fill="#161b22" stroke="#30363d"/>')
              top.append(
                  f'<text x="{x + bw / 2:.1f}" y="38" text-anchor="middle"><tspan font-family="{MONO}" font-size="24" font-weight="700" fill="{c}">{v}</tspan>'
                  f'<tspan dx="7" font-family="{SANS}" font-size="13.5" fill="#8b949e">{l}</tspan></text>')

          # 近 12 个月：行 = 月份(旧到新)，列 = 当月第几天
          last = date.fromisoformat(days[-1][0])
          months = []
          y_, m_ = last.year, last.month
          for _ in range(12):
              months.append((y_, m_))
              m_ -= 1
              if m_ == 0:
                  y_, m_ = y_ - 1, 12
          months.reverse()
          pts_data = []
          for ds, c in days:
              if c <= 0:
                  continue
              d0 = date.fromisoformat(ds)
              if (d0.year, d0.month) in months:
                  pts_data.append((d0.day - 1, months.index((d0.year, d0.month)), c))

          FU, FV, SIG = 2, 2, 1.0
          NX, NY = 31 * FU, 12 * FV
          HMAX = 86


          def field(a, b):
              xd, yd = a / FU - 0.5, b / FV - 0.5
              return sum(c * math.exp(-((xd - dx) ** 2 + (yd - dy) ** 2) / (2 * SIG * SIG)) for dx, dy, c in pts_data)


          raw = [[field(a, b) for a in range(NX + 1)] for b in range(NY + 1)]
          vmax = max(max(r) for r in raw) or 1
          H = [[HMAX * (v / vmax) ** 0.7 for v in r] for r in raw]

          STOPS = [(0.0, (30, 38, 47)), (0.04, (14, 68, 41)), (0.3, (0, 109, 50)), (0.6, (38, 166, 65)),
                   (0.85, (57, 211, 83)), (1.0, (227, 179, 65))]


          def ramp(t):
              for k in range(len(STOPS) - 1):
                  t0, c0 = STOPS[k]
                  t1, c1 = STOPS[k + 1]
                  if t <= t1:
                      f = (t - t0) / (t1 - t0) if t1 > t0 else 0
                      return tuple(c0[i] + (c1[i] - c0[i]) * f for i in range(3))
              return STOPS[-1][1]


          cu, cv = 9.0, 4.6
          ox, oy = NY * cu, HMAX + 10
          quads = []
          minx = miny = 1e9
          maxx = maxy = -1e9
          for b in range(NY):
              for a in range(NX):
                  h00, h10, h11, h01 = H[b][a], H[b][a + 1], H[b + 1][a + 1], H[b + 1][a]
                  P = []
                  for (aa, bb, hh) in ((a, b, h00), (a + 1, b, h10), (a + 1, b + 1, h11), (a, b + 1, h01)):
                      px = ox + (aa - bb) * cu
                      py = oy + (aa + bb) * cv - hh
                      P.append((px, py))
                      minx, maxx, miny, maxy = min(minx, px), max(maxx, px), min(miny, py), max(maxy, py)
                  t = (h00 + h10 + h11 + h01) / 4 / HMAX
                  gx = ((h10 + h11) - (h00 + h01)) / 2
                  gy = ((h01 + h11) - (h00 + h10)) / 2
                  f = max(0.62, min(1.3, 1 + 0.045 * (gx - gy)))
                  r, g, bl = ramp(t)
                  col = '#%02x%02x%02x' % (min(255, int(r * f)), min(255, int(g * f)), min(255, int(bl * f)))
                  quads.append((a + b, ' '.join(f'{x:.1f},{y:.1f}' for x, y in P), col))
          quads.sort(key=lambda q: q[0])

          cal_top = 76
          PADY = 56
          terrain_w = maxx - minx
          cal_h = PADY + (maxy - miny) + 64
          shift_x = (W - terrain_w) / 2 - minx
          shift_y = cal_top + PADY - miny
          top.append(card(0, cal_top, W, cal_h))
          top.append(title(28, cal_top + 36, '贡献地形图'))
          top.append(f'<text x="{W - 28}" y="{cal_top + 36}" text-anchor="end" fill="#8b949e" font-family="{SANS}" font-size="13">近一年 {total} 次贡献，山越高提交越多</text>')
          top.append(f'<g transform="translate({shift_x:.1f},{shift_y:.1f})" stroke-width=".5" stroke-linejoin="round">')
          for _, p, col in quads:
              top.append(f'<polygon points="{p}" fill="{col}" stroke="{col}"/>')
          top.append('</g>')
          for mi, (yy, mm) in enumerate(months):
              if (11 - mi) % 2:
                  continue
              b = (mi + 0.5) * FV
              px = ox + (0 - b) * cu + shift_x - 10
              py = oy + (0 + b) * cv + shift_y + 4
              top.append(f'<text x="{px:.1f}" y="{py:.1f}" text-anchor="end" fill="#6e7681" font-family="{SANS}" font-size="12">{mm}月</text>')
          ly = cal_top + cal_h - 26
          top.append(f'<text x="{W - 214}" y="{ly + 4}" text-anchor="end" fill="#6e7681" font-family="{SANS}" font-size="12">少</text>')
          for k in range(10):
              r, g, bl = ramp(k / 9)
              top.append(f'<rect x="{W - 204 + k * 15}" y="{ly - 6}" width="15" height="14" fill="#%02x%02x%02x"/>' % (int(r), int(g), int(bl)))
          top.append(f'<text x="{W - 46}" y="{ly + 4}" fill="#6e7681" font-family="{SANS}" font-size="12">多</text>')
          save('stats-top.svg', wrap(top, cal_top + cal_h, '统计与贡献地形图'))

          # ======== 下半：语言 + 方向 + 成就 ========
          mid = []
          LW, FW, ROW_H = 600, 400, 200
          mid.append(card(0, 0, LW, ROW_H))
          mid.append(title(28, 38, '常用语言'))
          mid.append(f'<text x="{LW - 28}" y="38" text-anchor="end" fill="#6e7681" font-family="{SANS}" font-size="12.5">按仓库数统计</text>')
          bx, bwid = 28, LW - 56
          mid.append(f'<clipPath id="lc"><rect x="{bx}" y="56" width="{bwid}" height="14" rx="7"/></clipPath><g clip-path="url(#lc)">')
          x = bx
          for name, (n, color) in lang_list:
              w = bwid * n / lang_total
              mid.append(f'<rect x="{x:.1f}" y="56" width="{max(w - 2, 1):.1f}" height="14" fill="{color}"/>')
              x += w
          mid.append('</g>')
          colw = (LW - 56) / 2
          for k, (name, (n, color)) in enumerate(lang_list):
              cx, cy = 28 + (k % 2) * colw, 104 + (k // 2) * 30
              mid.append(f'<circle cx="{cx + 5:.1f}" cy="{cy - 5}" r="5.5" fill="{color}"/>')
              mid.append(f'<text x="{cx + 20:.1f}" y="{cy}" fill="#c9d1d9" font-family="{SANS}" font-size="14">{name}</text>')
              mid.append(f'<text x="{cx + colw - 28:.1f}" y="{cy}" text-anchor="end" fill="#8b949e" font-family="{MONO}" font-size="13">{n / lang_total * 100:.1f}%</text>')

          fx = LW + 12
          mid.append(card(fx, 0, FW, ROW_H))
          mid.append(title(fx + 28, 38, '方向'))
          focus = [('WebGIS / Cesium', f'{gis_repos} 个仓库', gis_repos / max(len(nodes), 1) * 1.6, '#39d353'),
                   ('AI 工具 / MCP', 'BugPack', 0.58, '#58a6ff'),
                   ('桌面应用', 'KindleDock', 0.26, '#e3b341')]
          for k, (nm, note, ratio, color) in enumerate(focus):
              fy = 78 + k * 40
              bwid2 = FW - 56
              mid.append(f'<text x="{fx + 28}" y="{fy}" fill="#c9d1d9" font-family="{SANS}" font-size="14">{nm}</text>')
              mid.append(f'<text x="{fx + FW - 28}" y="{fy}" text-anchor="end" fill="#8b949e" font-family="{SANS}" font-size="13">{note}</text>')
              mid.append(f'<rect x="{fx + 28}" y="{fy + 10}" width="{bwid2}" height="7" rx="3.5" fill="#21262d"/>')
              mid.append(f'<rect x="{fx + 28}" y="{fy + 10}" width="{bwid2 * min(ratio, 1):.1f}" height="7" rx="3.5" fill="{color}"/>')

          ay = ROW_H + 16
          AH = 116
          mid.append(card(0, ay, W, AH))
          mid.append(title(28, ay + 38, '成就'))
          badges = [(str(bug_stars), f'BugPack {bug_stars} Star', '开源项目', '#e3b341', '#33290f'),
                    ('npm', 'npm 已发布', 'bugpack-mcp', '#79c0ff', '#0c2d6b'),
                    ('GIS', 'Cesium 工具库', f'{gis_repos} 个相关仓库', '#56d364', '#0e2a18'),
                    (f'{years}y', f'{u["createdAt"][:4]} 年加入', f'{years} 年 GitHub 用户', '#c9d1d9', '#21262d')]
          bw4 = (W - 56) / 4
          for k, (mark, t1, t2, color, fill) in enumerate(badges):
              bx0 = 28 + k * bw4
              mid.append(f'<g transform="translate({bx0:.1f},{ay + 52})"><polygon points="23,2 43,13 43,39 23,50 3,39 3,13" fill="{fill}" stroke="{color}" stroke-width="2"/>'
                         f'<text x="23" y="32" text-anchor="middle" font-family="{MONO}" font-size="14" font-weight="700" fill="{color}">{mark}</text></g>')
              mid.append(f'<text x="{bx0 + 58:.1f}" y="{ay + 72}" fill="#e6edf3" font-family="{SANS}" font-size="14" font-weight="600">{t1}</text>')
              mid.append(f'<text x="{bx0 + 58:.1f}" y="{ay + 94}" fill="#8b949e" font-family="{SANS}" font-size="12.5">{t2}</text>')
          save('stats-mid.svg', wrap(mid, ay + AH, '语言、方向与成就'))

          print(f'ok repos={repos_total} stars={stars} followers={followers} total={total} longest={longest} best={best} gis={gis_repos} points={len(pts_data)}')
          PY

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-top.svg assets/stats-mid.svg
          git diff --cached --quiet || (git commit -m "chore: 更新统计图" && git push)
